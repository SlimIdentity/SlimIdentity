name: Release

# Push a tag like v1.0.0 (or v1.0.0-rc.1) to publish to nuget.org and create a GitHub release.
#
# One-time setup on nuget.org (Trusted Publishing – no long-lived API key in the repository):
#   nuget.org → your account → Trusted Publishing → Add policy
#     Repository owner: timmkautz   Repository: slimidentity   Workflow file: release.yml   Environment: nuget
# and in GitHub: Settings → Environments → "nuget" (optionally with required reviewers),
# plus the repository/environment variable NUGET_USER = your nuget.org user name (not the e-mail).

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # create the GitHub release
  id-token: write  # OIDC token for nuget.org Trusted Publishing

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build SlimIdentity.slnx --configuration Release

      - name: Test
        run: dotnet test SlimIdentity.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/SlimIdentity/SlimIdentity.csproj --configuration Release --no-build --output artifacts

      - name: Log in to nuget.org (Trusted Publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" artifacts/* --generate-notes $prerelease
