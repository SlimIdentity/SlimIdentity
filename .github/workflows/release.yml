name: Release

# Push a tag like v0.9.0 (or v1.0.0-rc.1) to publish to nuget.org and create a GitHub release.
#
# One-time setup on nuget.org (Trusted Publishing – no long-lived API key in the repository):
#   nuget.org → your account → Trusted Publishing → Add policy
#     Policy owner: the organization SlimIdentity
#     Repository owner: SlimIdentity   Repository: SlimIdentity   Workflow file: release.yml   Environment: nuget
# and in GitHub: Settings → Environments → "nuget" (optionally with required reviewers),
# plus the repository/environment variable NUGET_USER = your nuget.org user name (not the e-mail).
# Recommended: reserve the ID prefix "SlimIdentity.*" on nuget.org, so all packages of this repository carry the
# verified checkmark and nobody else can publish under that prefix.

on:
  push:
    tags: ['v*']

permissions:
  contents: write      # create the GitHub release
  id-token: write      # OIDC token for nuget.org Trusted Publishing and for signing the attestations
  attestations: write  # build provenance of the packages

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build SlimIdentity.slnx --configuration Release

      - name: Test
        run: dotnet test SlimIdentity.slnx --configuration Release --no-build

      # every package in src/, all with the same version
      - name: Pack
        run: for p in src/*/*.csproj; do dotnet pack "$p" --configuration Release --no-build --output artifacts || exit 1; done

      # build provenance (SLSA): a signed statement that exactly these packages were built from this commit by this
      # workflow – anyone can check a downloaded package: gh attestation verify <file>.nupkg --owner SlimIdentity
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/*.nupkg'

      - name: Log in to nuget.org (Trusted Publishing)
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" artifacts/* --generate-notes $prerelease
