name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # MinVer needs the tags

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SlimIdentity.slnx

      - name: Build
        run: dotnet build SlimIdentity.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SlimIdentity.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # the demo is published as Native AOT: any trimming/AOT warning in the library fails the build
      - name: Native AOT publish (demo)
        run: dotnet publish samples/SlimIdentity.Demo --configuration Release --runtime linux-x64 --output aot

      - name: Check for vulnerable packages
        run: dotnet list SlimIdentity.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt && ! grep -q "has the following vulnerable packages" vulnerable.txt

      - name: Pack
        run: for p in src/*/*.csproj; do dotnet pack "$p" --configuration Release --no-build --output artifacts || exit 1; done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results
          path: TestResults

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-package
          path: artifacts/*
